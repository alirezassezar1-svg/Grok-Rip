    { id: "icon30", name: "icon30",         icon: "⚡", cls: "icon-c22",  file: "#", desc: "قابل ویرایش" }
  ];

  const dockApps = apps.slice(0, 4);
  const pageApps = apps.slice(4);
  const PER_PAGE = 24;
  let currentPage = 0;
  let totalPages = Math.ceil(pageApps.length / PER_PAGE) || 1;

  function renderPages() {
    const track = document.getElementById("pagesTrack");
    track.innerHTML = "";
    for (let p = 0; p < totalPages; p++) {
      const page = document.createElement("div");
      page.className = "app-page";
      const start = p * PER_PAGE;
      const slice = pageApps.slice(start, start + PER_PAGE);
      slice.forEach(app => {
        const el = document.createElement("div");
        el.className = "app";
        el.innerHTML = `<div class="app-icon ${app.cls}">${app.icon}</div><div class="app-label">${app.name}</div>`;
        el.onclick = () => openApp(app);
        page.appendChild(el);
      });
      track.appendChild(page);
    }
    renderDots();
    goToPage(0);
  }

  function renderDots() {
    const dots = document.getElementById("pageDots");
    dots.innerHTML = "";
    for (let i = 0; i < totalPages; i++) {
      const d = document.createElement("div");
      d.className = "dot" + (i === currentPage ? " active" : "");
      d.onclick = () => goToPage(i);
      dots.appendChild(d);
    }
  }

  function goToPage(n) {
    currentPage = Math.max(0, Math.min(n, totalPages - 1));
    document.getElementById("pagesTrack").style.transform = `translateX(${currentPage * -100}%)`;
    document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === currentPage));
  }

  function renderDock() {
    const dock = document.getElementById("dock");
    dock.innerHTML = "";
    dockApps.forEach(app => {
      const el = document.createElement("div");
      el.className = "app";
      el.innerHTML = `<div class="app-icon ${app.cls}">${app.icon}</div>`;
      el.onclick = () => openApp(app);
      dock.appendChild(el);
    });
  }

  function openApp(app) {
    if (app.file === "#") {
      document.getElementById("modalIcon").textContent = app.icon;
      document.getElementById("modalTitle").textContent = app.name;
      document.getElementById("modalDesc").textContent = app.desc + "\n(هنوز فایل لینک نشده)";
      document.getElementById("modalOpen").onclick = () => closeModal();
      document.getElementById("modalOverlay").classList.add("open");
      return;
    }
    window.location.href = app.file;
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
  }
  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("modalOverlay").onclick = e => { if (e.target.id === "modalOverlay") closeModal(); };

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
  }
  updateClock();
  setInterval(updateClock, 30000);

  // Swipe
  let touchStartX = 0;
  const pagesWrap = document.getElementById("pagesWrap");
  pagesWrap.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  pagesWrap.addEventListener("touchend", e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (diff > 50) goToPage(currentPage + 1);
    if (diff < -50) goToPage(currentPage - 1);
  }, { passive: true });

  // Sidebar
  const sidebar = document.getElementById("sidebar");
  const sidebarBackdrop = document.getElementById("sidebarBackdrop");
  function openSidebar() { sidebar.classList.add("open"); sidebarBackdrop.classList.add("open"); }
  function closeSidebar() { sidebar.classList.remove("open"); sidebarBackdrop.classList.remove("open"); }
  sidebarBackdrop.onclick = closeSidebar;
  document.getElementById("island").onclick = () => sidebar.classList.contains("open") ? closeSidebar() : openSidebar();

  // Edge swipe for sidebar
  document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  document.addEventListener("touchend", e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (diff > 60) openSidebar();
    if (diff < -60 && sidebar.classList.contains("open")) closeSidebar();
  }, { passive: true });
  document.addEventListener("contextmenu", e => e.preventDefault());

  renderPages();
  renderDock();
</script>
