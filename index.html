.sidebar-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;visibility:hidden;transition:.3s}.sidebar-overlay.open{opacity:1;visibility:visible}
.sidebar{position:absolute;top:0;right:0;width:78%;max-width:300px;height:100%;background:rgba(28,28,30,.92);backdrop-filter:blur(40px);z-index:210;transform:translateX(105%);transition:transform .38s;border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;padding-top:calc(var(--safe-top)+8px)}.sidebar.open{transform:translateX(0)}

.menu-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;color:#fff;font-size:16px;cursor:pointer}.menu-item:hover{background:rgba(255,255,255,.08)}.menu-section{font-size:13px;color:rgba(255,255,255,.4);padding:18px 14px 8px}
.sidebar-trigger{position:absolute;top:50%;right:0;transform:translateY(-50%);width:6px;height:80px;background:rgba(255,255,255,.15);border-radius:4px 0 0 4px;z-index:60;cursor:pointer}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:300;opacity:0;visibility:hidden;transition:.3s;display:flex;align-items:flex-end;justify-content:center}.modal-overlay.open{opacity:1;visibility:visible}
.modal{width:100%;max-height:70%;background:#1c1c1e;border-radius:28px 28px 0 0;padding:12px 20px 40px;transform:translateY(100%);transition:transform .38s}.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:40px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin:0 auto 18px}.modal-icon{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 14px}.modal h3{text-align:center;font-size:1.3rem;margin-bottom:6px}.modal p{text-align:center;color:rgba(255,255,255,.55);font-size:.95rem;margin-bottom:22px;white-space:pre-line}.modal-actions{display:flex;gap:12px}.modal-btn{flex:1;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer}.modal-btn.primary{background:var(--accent);color:#fff}.modal-btn.secondary{background:rgba(255,255,255,.1);color:#fff}
@media(max-width:440px){body{padding:0}.phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}.screen{inset:0;border-radius:0}.brand{display:none}.btn-vol-up,.btn-vol-down,.btn-power,.btn-action{display:none}}

<body>
<div class="brand"><h1>Grok-Rip</h1><p>iPhone 16 Pro Max Style</p></div>

{id:"icon30",name:"Icon 30",icon:"✨",cls:"icon-c30",file:"icon30.html",desc:"قابل ویرایش"}
];
const dockApps=[{id:"mohta",name:"Studio",icon:"📝",cls:"icon-mohta",file:"mohta-qwen.html",desc:"Studio"},{id:"goft",name:"Forge",icon:"🛠️",cls:"icon-goft",file:"goft.html",desc:"Forge"},{id:"deep",name:"Deep",icon:"🌌",cls:"icon-deep",file:"deep3.html",desc:"Deep"},{id:"back",name:"Backend",icon:"⚙️",cls:"icon-back",file:"back_qwen.html",desc:"Backend"}];
const dock=document.getElementById("dock"),pagesTrack=document.getElementById("pagesTrack"),pageDots=document.getElementById("pageDots"),sidebarMenu=document.getElementById("sidebarMenu");
const PER_PAGE=24;let currentPage=0;const totalPages=Math.ceil(apps.length/PER_PAGE);
function createAppEl(app,isDock){const el=document.createElement("div");el.className="app";el.innerHTML=`<div class="app-icon ${app.cls}">${app.icon}</div>${isDock?"":`<div class="app-label">${app.name}</div>`}`;el.onclick=()=>openApp(app);return el}
for(let p=0;p<totalPages;p++){const page=document.createElement("div");page.className="app-page";apps.slice(p*PER_PAGE,(p+1)*PER_PAGE).forEach(a=>page.appendChild(createAppEl(a)));pagesTrack.appendChild(page);const dot=document.createElement("div");dot.className="dot"+(p===0?" active":"");pageDots.appendChild(dot)}
dockApps.forEach(a=>dock.appendChild(createAppEl(a,true)));
function goToPage(n){currentPage=Math.max(0,Math.min(n,totalPages-1));pagesTrack.style.transform=`translateX(${currentPage*100*(document.documentElement.dir==="rtl"?1:-1)}%)`;pageDots.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active",i===currentPage))}
let startX=0,startY=0,swiping=false;const wrap=document.getElementById("pagesWrap");
wrap.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;swiping=true},{passive:true});
wrap.addEventListener("touchend",e=>{if(!swiping)return;swiping=false;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)<40||Math.abs(dy)>Math.abs(dx))return;if(document.documentElement.dir==="rtl"){if(dx>0)goToPage(currentPage-1);else goToPage(currentPage+1)}else{if(dx<0)goToPage(currentPage+1);else goToPage(currentPage-1)}},{passive:true});
apps.forEach(app=>{const item=document.createElement("div");item.className="menu-item";item.innerHTML=`<div class="app-icon ${app.cls}" style="width:36px;height:36px;font-size:18px;border-radius:8px">${app.icon}</div>${app.name}`;item.onclick=()=>{document.getElementById("sidebar").classList.remove("open");document.getElementById("sidebarOverlay").classList.remove("open");setTimeout(()=>openApp(app),280)};sidebarMenu.appendChild(item)});
const modalOverlay=document.getElementById("modalOverlay");let currentApp=null;
function openApp(app){currentApp=app;document.getElementById("modalIcon").className="modal-icon "+(app.cls||"");document.getElementById("modalIcon").textContent=app.icon;document.getElementById("modalTitle").textContent=app.name;document.getElementById("modalDesc").textContent=app.desc+(app.file?"\n\nفایل: "+app.file:"");modalOverlay.classList.add("open")}
function closeModal(){modalOverlay.classList.remove("open");currentApp=null}
document.getElementById("modalClose").onclick=closeModal;modalOverlay.onclick=e=>{if(e.target===modalOverlay)closeModal()};
document.getElementById("modalOpen").onclick=()=>{if(currentApp&&currentApp.file)location.href=currentApp.file;else closeModal()};
document.getElementById("sidebarTrigger").onclick=()=>{document.getElementById("sidebar").classList.add("open");document.getElementById("sidebarOverlay").classList.add("open")};
document.getElementById("sidebarClose").onclick=()=>{document.getElementById("sidebar").classList.remove("open");document.getElementById("sidebarOverlay").classList.remove("open")};
