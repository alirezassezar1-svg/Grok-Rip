    const el = document.createElement("div");
    el.className = "app";
    el.innerHTML = `<div class="app-icon ${app.cls}">${app.icon}</div>${isDock ? "" : `<div class="app-label">${app.name}</div>`}`;
    el.addEventListener("click", () => openApp(app));
    return el;
  }

  apps.forEach(app => grid.appendChild(createAppEl(app)));
  dockApps.forEach(app => dock.appendChild(createAppEl(app, true)));

  apps.forEach(app => {
    const item = document.createElement("div");
    item.className = "menu-item";
    item.innerHTML = `<div class="mi-icon ${app.cls}">${app.icon}</div>${app.name}`;
    item.addEventListener("click", () => { closeSidebar(); setTimeout(() => openApp(app), 280); });
    sidebarMenu.appendChild(item);
  });

  function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
  }
  updateClock();
  setInterval(updateClock, 10000);

  const sidebar = document.getElementById("sidebar");
  const sidebarOverlay = document.getElementById("sidebarOverlay");
  function openSidebar() { sidebar.classList.add("open"); sidebarOverlay.classList.add("open"); }
  function closeSidebar() { sidebar.classList.remove("open"); sidebarOverlay.classList.remove("open"); }
  document.getElementById("sidebarTrigger").addEventListener("click", openSidebar);
  document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
  sidebarOverlay.addEventListener("click", closeSidebar);

  document.querySelectorAll(".menu-item[data-action]").forEach(item => {
    item.addEventListener("click", () => {
      if (item.dataset.action === "home") closeSidebar();
      if (item.dataset.action === "about") {
        closeSidebar();
        setTimeout(() => openApp({ id:"about", name:"درباره Grok-Rip", icon:"💜", cls:"icon-nebula", file:null, desc:"ریپوی ایزوله شامل تمام ابزارهای Nononick Suite.\nهمه فایل‌ها لینک شدن و آماده‌ی GitHub Pages هستند." }), 280);
      }
    });
  });

  const modalOverlay = document.getElementById("modalOverlay");
  let currentApp = null;
  function openApp(app) {
    currentApp = app;
    document.getElementById("modalIcon").className = "modal-icon " + (app.cls || "");
    document.getElementById("modalIcon").textContent = app.icon;
    document.getElementById("modalTitle").textContent = app.name;
    document.getElementById("modalDesc").textContent = app.desc + (app.file ? "\n\nفایل: " + app.file : "");
    modalOverlay.classList.add("open");
  }
  function closeModal() { modalOverlay.classList.remove("open"); currentApp = null; }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", e => { if (e.target === modalOverlay) closeModal(); });
  document.getElementById("modalOpen").addEventListener("click", () => {
    if (currentApp && currentApp.file) {
      window.location.href = currentApp.file;
    } else {
      closeModal();
    }
  });

  let touchStartX = 0;
  document.querySelector(".screen").addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  document.querySelector(".screen").addEventListener("touchend", e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (diff > 60) openSidebar();
    if (diff < -60 && sidebar.classList.contains("open")) closeSidebar();
  }, { passive: true });
  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
